{% extends "base.html" %}

{% block content %}
    <form action="" method="get">
        {{ form }}
        <input type="submit" value="Search">
    </form><br/>

    <div class="card">
        {% for post in posts %}
            <a href="{{ post.get_absolute_url }}" class="card-body">
                {{ post.body|truncatewords:8 }}
            </a>

        {% endfor %}

    </div>
{% endblock %}
