{% extends "base.html" %}

{% block content %}
    <h3>Index Page..!</h3><br/>
    <div class="card">
        {% for post in posts %}
            <a href="{{ post.get_absolute_url }}" class="card-body">
                {{ post.body|truncatewords:8 }}
            </a>

        {% endfor %}

    </div>
{% endblock %}
